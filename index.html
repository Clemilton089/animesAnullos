<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

            'https://i.postimg.cc/hGxKJjr1/216-Sem-T-tulo-20250502152016.png',
            'https://i.postimg.cc/RFB4wBp5/216-Sem-T-tulo-20250502152005.png'
        ];
        let currentUser = localStorage.getItem('currentUser') || null, selectedAvatar = avatars[0], selectedGenre = null, currentAnimeIndex = null, currentEpisode = null, isAdPlaying = false;

        function normalizeVideoURL(url) {
            const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|drive\.google\.com\/file\/d\/[^\/]+\/view\?usp=sharing|drive\.google\.com\/file\/d\/[^\/]+\/view\?usp=drivesdk)([a-zA-Z0-9_-]+)/;
            return driveRegex.test(url) ? `https://drive.google.com/file/d/${url.match(driveRegex)[1]}/preview` : url;
        }

        function extractVideoThumbnail(url) {
            const youtubeRegex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/;
            const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|drive\.google\.com\/file\/d\/[^\/]+\/view\?usp=sharing|drive\.google\.com\/file\/d\/[^\/]+\/view\?usp=drivesdk)([a-zA-Z0-9_-]+)/;
            return youtubeRegex.test(url) ? `https://img.youtube.com/vi/${url.match(youtubeRegex)[1]}/hqdefault.jpg` :
                   driveRegex.test(url) ? `https://drive.google.com/thumbnail?id=${url.match(driveRegex)[1]}` : null;
        }

        function saveData() {
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('animes', JSON.stringify(animes));
            localStorage.setItem('releases', JSON.stringify(releases));
            localStorage.setItem('comments', JSON.stringify(comments));
            localStorage.setItem('avatars', JSON.stringify(avatars));
        }

        function updateBackgroundImage() {
            const bg = localStorage.getItem('authBackgroundImage');
            if (bg) document.body.style.background = `url('${bg}') no-repeat center/cover fixed`;
        }

        function changeBackgroundImage() {
            if (currentUser !== 'ADM') return;
            const file = document.getElementById('background-image')?.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                localStorage.setItem('authBackgroundImage', reader.result);
                updateBackgroundImage();
                document.getElementById('admin-message').textContent = 'Fundo alterado!';
            };
            reader.readAsDataURL(file);
        }

        function addAvatar() {
            if (currentUser !== 'ADM') return;
            const file = document.getElementById('avatar-image')?.files[0];
            const message = document.getElementById('admin-message');
            if (!file) {
                message.textContent = 'Selecione uma imagem para o avatar.';
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                avatars.push(reader.result);
                saveData();
                updateAvatarList();
                message.textContent = 'Avatar adicionado!';
            };
            reader.readAsDataURL(file);
        }

        function updateAvatarList() {
            if (currentUser !== 'ADM') return;
            const list = document.getElementById('avatar-list');
            list.innerHTML = '';
            avatars.forEach337((avatar, i) => {
                const item = document.createElement('div');
                item.className = 'avatar-admin-item';
                item.innerHTML = `
                    <img src="${avatar}" alt="Avatar ${i + 1}">
                    <div>
                        <button class="edit-btn" onclick="replaceAvatar(${i})">Substituir</button>
                        <button class="delete-btn" onclick="deleteAvatar(${i})">Excluir</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function replaceAvatar(index) {
            if (currentUser !== 'ADM') return;
            const file = prompt('Selecione uma nova imagem para substituir o avatar:', '');
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = () => {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    avatars[index] = reader.result;
                    saveData();
                    updateAvatarList();
                    document.getElementById('admin-message').textContent = 'Avatar substituído!';
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function deleteAvatar(index) {
            if (currentUser !== 'ADM') return;
            if (avatars.length <= 1) {
                document.getElementById('admin-message').textContent = 'Pelo menos um avatar é necessário.';
                return;
            }
            if (confirm('Confirma a exclusão deste avatar?')) {
                const isUsed = Object.values(users).some(u => u.avatar === avatars[index]);
                if (isUsed) {
                    document.getElementById('admin-message').textContent = 'Este avatar está em uso por um usuário e não pode ser excluído.';
                    return;
                }
                avatars.splice(index, 1);
                saveData();
                updateAvatarList();
                document.getElementById('admin-message').textContent = 'Avatar excluído!';
            }
        }

        function updateEpisodeURLs() {
            const episodes = parseInt(document.getElementById('anime-episodes').value) || 0;
            const container = document.getElementById('episode-urls-container');
            container.innerHTML = '';
            for (let i = 1; i <= episodes; i++) {
                const label = document.createElement('label');
                label.textContent = `URL do Episódio ${i}:`;
                const input = document.createElement('input');
                input.type = 'url';
                input.id = `episode-url-${i}`;
                input.placeholder = `URL do vídeo do Episódio ${i}`;
                container.appendChild(label);
                container.appendChild(input);
            }
        }

        function loadAdSense() {
            const adScript = document.createElement('script');
            adScript.async = true;
            adScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX';
            adScript.crossOrigin = 'anonymous';
            document.head.appendChild(adScript);
            adScript.onload = () => {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});

        function showLoading() { document.getElementById('loading-screen').classList.add('show'); }
        function hideLoading() { document.getElementById('loading-screen').classList.remove('show'); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function toggleUserDropdown() { document.getElementById('user-dropdown').classList.toggle('show'); }

        function showSection(section) {
            const sections = ['auth', 'terms', 'profile', 'anime', 'search', 'episode', 'admin'];
            sections.forEach(s => document.getElementById(`${s}-section`)?.classList.toggle('hidden', s !== section));
            document.body.classList.toggle('auth-background', section === 'auth' || section === 'terms');
            if (section !== 'auth' && section !== 'terms') {
                document.getElementById('search-bar')?.classList.remove('hidden');
                document.getElementById('menu-toggle')?.classList.remove('hidden');
                document.getElementById('user-account')?.classList.remove('hidden');
            } else {
                document.getElementById('search-bar')?.classList.add('hidden');
                document.getElementById('menu-toggle')?.classList.add('hidden');
                document.getElementById('user-account')?.classList.add('hidden');
            }
            if (section === 'auth') showForm('login');
            if (section === 'profile') {
                document.getElementById('profile-username').value = currentUser || '';
                populateAvatarGrid('profile-avatar-grid', users[currentUser]?.avatar);
            }
            if (section === 'anime') {
                updateAnimeGrid();
                updateHighlightsGrid();
            }
            if (section === 'search') {
                populateGenreFilter();
                searchAnime();
            }
            if (section === 'admin' && currentUser === 'ADM') {
                updateAdminAnimeList();
                updateReleaseList();
                updateAvatarList();
                populateReleaseAnimeSelect();
            } else if (section === 'admin' && currentUser !== 'ADM') {
                showSection('anime');
            }
            if (section !== 'episode') {
                document.getElementById('video-player').classList.add('hidden');
                document.getElementById('episode-list').classList.remove('hidden');
                document.getElementById('player-content').innerHTML = '';
                document.getElementById('skip-ad-btn').classList.add('hidden');
                document.getElementById('adsense-ad').classList.remove('show');
                currentAnimeIndex = currentEpisode = null;
                isAdPlaying = false;
            }
            updateBackgroundImage();
        }

        function showForm(form) {
            document.getElementById('login-form')?.classList.toggle('hidden', form !== 'login');
            document.getElementById('register-form')?.classList.toggle('hidden', form !== 'register');
            document.querySelectorAll('.tab').forEach((tab, i) => tab.classList.toggle('active', i === (form === 'login' ? 0 : 1)));
            if (form === 'register') populateAvatarGrid('register-avatar-grid');
        }

        function populateAvatarGrid(gridId, selected = avatars[0]) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            avatars.forEach(avatar => {
                const item = document.createElement('div');
                item.className = `avatar-item ${avatar === selected ? 'selected' : ''}`;
                item.innerHTML = `<img src="${avatar}" alt="Avatar">`;
                item.onclick = () => {
                    selectedAvatar = avatar;
                    grid.querySelectorAll('.avatar-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                };
                grid.appendChild(item);
            });
        }

        function populateGenreFilter() {
            const filter = document.getElementById('genre-filter');
            filter.innerHTML = '';
            new Set(animes.flatMap(a => a.genres || [])).forEach(genre => {
                const btn = document.createElement('button');
                btn.className = `genre-btn ${genre === selectedGenre ? 'active' : ''}`;
                btn.textContent = genre;
                btn.onclick = () => {
                    selectedGenre = selectedGenre === genre ? null : genre;
                    filter.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
                    if (selectedGenre) btn.classList.add('active');
                    searchAnime();
                };
                filter.appendChild(btn);
            });
        }

        function register() {
            showLoading();
            setTimeout(() => {
                const username = document.getElementById('register-username')?.value.trim();
                const password = document.getElementById('register-password')?.value;
                const gmail = document.getElementById('register-gmail')?.value.trim().toLowerCase();
                const terms = document.getElementById('terms')?.checked;
                const message = document.getElementById('register-message');

                if (!username || !password || !gmail || !terms) {
                    message.textContent = 'Preencha todos os campos e aceite os termos.';
                    hideLoading();
                    return;
                }
                if (!gmail.endsWith('@gmail.com') && gmail !== 'admin@animeflix.com') {
                    message.textContent = 'Use um Gmail válido.';
                    hideLoading();
                    return;
                }
                if (users[username] || Object.values(users).some(u => u.gmail === gmail)) {
                    message.textContent = 'Usuário ou Gmail já existe.';
                    hideLoading();
                    return;
                }

                users[username] = { password, avatar: selectedAvatar, gmail };
                currentUser = username;
                localStorage.setItem('currentUser', currentUser);
                saveData();
                updateUserInterface();
                showSection('anime');
                hideLoading();
            }, 500);
        }

        function login() {
            showLoading();
            setTimeout(() => {
                const username = document.getElementById('login-username')?.value.trim();
                const password = document.getElementById('login-password')?.value;
                const gmail = document.getElementById('login-gmail')?.value.trim().toLowerCase();
                const message = document.getElementById('login-message');

                if (!username || !password || !gmail) {
                    message.textContent = 'Preencha todos os campos.';
                    hideLoading();
                    return;
                }
                if (!users[username] || users[username].password !== password || users[username].gmail !== gmail) {
                    message.textContent = 'Credenciais inválidas.';
                    hideLoading();
                    return;
                }

                currentUser = username;
                localStorage.setItem('currentUser', currentUser);
                updateUserInterface();
                showSection(currentUser === 'ADM' ? 'admin' : 'anime');
                hideLoading();
            }, 500);
        }

        function updateUserInterface() {
            document.getElementById('user-account').classList.remove('hidden');
            document.getElementById('user-avatar').src = users[currentUser]?.avatar;
            document.getElementById('sidebar-profile-btn').classList.remove('hidden');
            document.getElementById('profile-btn').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('admin-btn').classList.toggle('hidden', currentUser !== 'ADM');
        }

        function logout() {
            showLoading();
            setTimeout(() => {
                currentUser = null;
                localStorage.removeItem('currentUser');
                showSection('auth');
                document.getElementById('sidebar-profile-btn').classList.add('hidden');
                document.getElementById('admin-btn').classList.add('hidden');
                hideLoading();
            }, 500);
        }

        function saveProfile() {
            showLoading();
            setTimeout(() => {
                const newUsername = document.getElementById('profile-username')?.value.trim();
                const message = document.getElementById('profile-message');
                if (!newUsername || (newUsername !== currentUser && users[newUsername])) {
                    message.textContent = 'Nome inválido ou já existe.';
                    hideLoading();
                    return;
                }
                if (newUsername !== currentUser) {
                    users[newUsername] = { ...users[currentUser] };
                    delete users[currentUser];
                    currentUser = newUsername;
                    localStorage.setItem('currentUser', currentUser);
                }
                users[currentUser].avatar = selectedAvatar;
                saveData();
                updateUserInterface();
                message.textContent = 'Perfil atualizado!';
                hideLoading();
            }, 500);
        }

        function addAnime() {
            if (currentUser !== 'ADM') return;
            const name = document.getElementById('anime-name')?.value.trim();
            const season = document.getElementById('anime-season')?.value;
            const episodes = parseInt(document.getElementById('anime-episodes')?.value);
            const genres = document.getElementById('anime-genres')?.value.trim().split(',').map(g => g.trim()).filter(g => g);
            const cover = document.getElementById('anime-cover')?.files[0];
            const adURL = document.getElementById('anime-ad-url')?.value.trim();
            const message = document.getElementById('admin-message');

            if (!name || !season || !episodes || !genres.length || !cover) {
                message.textContent = 'Preencha todos os campos obrigatórios.';
                return;
            }

            const episodeData = {};
            let allURLsValid = true;
            for (let i = 1; i <= episodes; i++) {
                const urlInput = document.getElementById(`episode-url-${i}`);
                const videoURL = urlInput?.value.trim();
                if (!videoURL) {
                    message.textContent = `Insira a URL do Episódio ${i}.`;
                    allURLsValid = false;
                    return;
                }
                episodeData[i] = { name: `Episódio ${i}`, video: normalizeVideoURL(videoURL) };
            }

            if (!allURLsValid) return;

            const reader = new FileReader();
            reader.onload = () => {
                const firstEpisodeURL = episodeData[1].video;
                animes.push({
                    name,
                    season: parseInt(season),
                    episodes,
                    genres,
                    coverURL: reader.result,
                    episodeCoverURL: extractVideoThumbnail(firstEpisodeURL) || reader.result,
                    episodesData: episodeData,
                    adURL: adURL ? normalizeVideoURL(adURL) : null
                });
                saveData();
                updateAdminAnimeList();
                populateReleaseAnimeSelect();
                showSection('anime');
                message.textContent = 'Anime adicionado!';
            };
            reader.readAsDataURL(cover);
        }

        function updateAnimeGrid() {
            const grid = document.getElementById('genre-grid');
            grid.innerHTML = '';
            animes.forEach((anime, i) => {
                const item = document.createElement('div');
                item.className = 'genre-item';
                item.innerHTML = `<img src="${anime.coverURL}" alt="${anime.name}"><div class="card-overlay"><p>${anime.name} (T${anime.season})</p></div>`;
                item.onclick = () => showEpisodes(i);
                grid.appendChild(item);
            });
        }

        function updateHighlightsGrid() {
            const grid = document.getElementById('highlights-grid');
            grid.innerHTML = '';
            releases.forEach(r => {
                const anime = animes[r.animeIndex];
                if (anime) {
                    const item = document.createElement('div');
                    item.className = 'highlight-item';
                    item.innerHTML = `<img src="${anime.episodeCoverURL}" alt="${anime.name}"><div class="card-overlay"><p>${anime.name} T${anime.season} E${r.episode}</p></div>`;
                    item.onclick = () => showEpisodes(r.animeIndex, r.episode);
                    grid.appendChild(item);
                }
            });
        }

        function searchAnime() {
            const query = document.getElementById('search-input')?.value.toLowerCase().trim();
            const grid = document.getElementById('search-grid');
            grid.innerHTML = '';
            animes.filter(a => (!query || a.name.toLowerCase().includes(query) || a.genres?.some(g => g.toLowerCase().includes(query))) &&
                            (!selectedGenre || a.genres?.includes(selectedGenre)))
                .forEach((a, i) => {
                    const item = document.createElement('div');
                    item.className = 'genre-item';
                    item.innerHTML = `<img src="${a.coverURL}" alt="${a.name}"><div class="card-overlay"><p>${a.name} (T${a.season})</p></div>`;
                    item.onclick = () => showEpisodes(i);
                    grid.appendChild(item);
                });
        }

        function showEpisodes(index, autoPlayEpisode = null) {
            const anime = animes[index];
            document.getElementById('episode-title').textContent = `${anime.name} (Temporada ${anime.season})`;
            document.getElementById('episode-cover').src = anime.coverURL;
            const list = document.getElementById('episode-list');
            const videoPlayer = document.getElementById('video-player');
            list.innerHTML = '';
            for (let i = 1; i <= anime.episodes; i++) {
                const item = document.createElement('div');
                item.className = 'episode-item';
                item.innerHTML = `<img src="${anime.coverURL}" alt="${anime.episodesData[i].name}"><p>${anime.episodesData[i].name}</p>`;
                item.onclick = () => openVideoPlayer(index, i);
                list.appendChild(item);
            }
            videoPlayer.classList.add('hidden');
            list.classList.remove('hidden');
            document.getElementById('player-content').innerHTML = '';
            document.getElementById('skip-ad-btn').classList.add('hidden');
            document.getElementById('adsense-ad').classList.remove('show');
            showSection('episode');
            if (autoPlayEpisode) openVideoPlayer(index, autoPlayEpisode);
        }

        function openVideoPlayer(animeIndex, episode) {
            const anime = animes[animeIndex];
            const videoURL = anime.episodesData[episode].video;
            const adURL = anime.adURL;
            const playerContent = document.getElementById('player-content');
            const videoPlayer = document.getElementById('video-player');
            const episodeList = document.getElementById('episode-list');
            const prevBtn = document.getElementById('prev-episode-btn');
            const nextBtn = document.getElementById('next-episode-btn');
            const errorMessage = document.getElementById('error-message');
            const downloadBtn = document.getElementById('download-btn');
            const skipAdBtn = document.getElementById('skip-ad-btn');

            currentAnimeIndex = animeIndex;
            currentEpisode = episode;

            function playMainVideo() {
                isAdPlaying = false;
                playerContent.innerHTML = `<iframe src="${normalizeVideoURL(videoURL)}" allow="autoplay; fullscreen"></iframe>`;
                skipAdBtn.classList.add('hidden');
                errorMessage.classList.add('hidden');
                downloadBtn.classList.add('hidden');
                playerContent.firstChild.onerror = () => {
                    errorMessage.textContent = 'Erro ao carregar vídeo. Baixe para reproduzir localmente.';
                    errorMessage.classList.remove('hidden');
                    downloadBtn.classList.remove('hidden');
                };
                loadAdSense();
            }

            if (adURL && !isAdPlaying) {
                isAdPlaying = true;
                playerContent.innerHTML = `<iframe src="${normalizeVideoURL(adURL)}" allow="autoplay; fullscreen"></iframe>`;
                skipAdBtn.classList.add('hidden');
                setTimeout(() => {
                    skipAdBtn.classList.remove('hidden');
                }, 5000);
                skipAdBtn.onclick = playMainVideo;
            } else {
                playMainVideo();
            }

            videoPlayer.classList.remove('hidden');
            episodeList.classList.add('hidden');
            prevBtn.disabled = episode === 1;
            nextBtn.disabled = episode === anime.episodes;
            prevBtn.onclick = () => openVideoPlayer(animeIndex, episode - 1);
            nextBtn.onclick = () => openVideoPlayer(animeIndex, episode + 1);
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = videoURL;
                link.download = `Ep_${episode}_${anime.name}.mp4`;
                link.click();
            };
            updateCommentSection();
        }

        function backToEpisodeList() {
            document.getElementById('video-player').classList.add('hidden');
            document.getElementById('episode-list').classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');
            document.getElementById('download-btn').classList.add('hidden');
            document.getElementById('player-content').innerHTML = '';
            document.getElementById('skip-ad-btn').classList.add('hidden');
            document.getElementById('adsense-ad').classList.remove('show');
            currentAnimeIndex = currentEpisode = null;
            isAdPlaying = false;
        }

            const commentText = document.getElementById('comment-input')?.value.trim();
            if (!commentText) return;
            const key = `${currentAnimeIndex}-${currentEpisode}`;

        function addToReleases() {
            if (currentUser !== 'ADM') return;
            const animeIndex = document.getElementById('release-anime')?.value;
            const episode = parseInt(document.getElementById('release-episode')?.value);
            const message = document.getElementById('admin-message');
            const anime = animes[animeIndex];

            if (!animeIndex || isNaN(episode) || episode < 1 || episode > anime.episodes) {
                message.textContent = 'Selecione um anime e um episódio válido.';
                return;
            }
            if (releases.some(r => r.animeIndex === parseInt(animeIndex) && r.episode === episode)) {
                message.textContent = 'Episódio já está nos lançamentos.';
                return;
            }

            releases.push({ animeIndex: parseInt(animeIndex), episode });
            saveData();
            updateReleaseList();
            updateHighlightsGrid();
            message.textContent = `Episódio ${episode} de ${anime.name} adicionado aos lançamentos.`;
        }

        function removeFromReleases(index) {
            if (currentUser !== 'ADM') return;
            releases.splice(index, 1);
            saveData();
            updateReleaseList();
            updateHighlightsGrid();
        }

        function updateReleaseList() {
            const list = document.getElementById('release-list');
            list.innerHTML = '';
            releases.forEach((r, i) => {
                const anime = animes[r.animeIndex];
                if (anime) {
                    const item = document.createElement('div');
                    item.className = 'release-item';
                    item.innerHTML = `<p>${anime.name} T${anime.season} E${r.episode}</p><button class="remove-release-btn" onclick="removeFromReleases(${i})">Remover</button>`;
                    list.appendChild(item);
                }
            });
        }

        function updateAdminAnimeList() {
            if (currentUser !== 'ADM') return;
            const list = document.getElementById('admin-anime-list');
            list.innerHTML = '';
            animes.forEach((a, i) => {
                const item = document.createElement('div');
                item.className = 'admin-anime-item';
                item.innerHTML = `
                    <img src="${a.coverURL}" alt="${a.name}">
                    <div>
                        <p>${a.name} (T${a.season}, ${a.genres?.join(', ') || 'Sem gêneros'})</p>
                        <button class="edit-btn" onclick="editAnime(${i})">Editar</button>
                        <button class="delete-btn" onclick="deleteAnime(${i})">Excluir</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function editAnime(index) {
            if (currentUser !== 'ADM') return;
            const anime = animes[index];
            const name = prompt('Nome:', anime.name);
            const season = prompt('Temporada:', anime.season);
            const episodes = prompt('Episódios:', anime.episodes);
            const genres = prompt('Gêneros (separados por vírgula):', anime.genres?.join(', ') || '');
            const message = document.getElementById('admin-message');

            if (!name || !season || !episodes || !genres) {
                message.textContent = 'Preencha todos os campos obrigatórios.';
                return;
            }

            const episodeURLs = [];
            for (let i = 1; i <= parseInt(episodes); i++) {
                const defaultURL = anime.episodesData[i]?.video || '';
                const url = prompt(`URL do Episódio ${i}:`, defaultURL);
                if (!url) {
                    message.textContent = `Insira a URL do Episódio ${i}.`;
                    return;
                }
                episodeURLs[i] = url;
            }

            const adURL = prompt('URL do anúncio (opcional):', anime.adURL || '');

            if (!confirm(`Confirma as alterações em "${name}" (T${season}, ${episodes} episódios)?`)) {
                message.textContent = 'Edição cancelada.';
                return;
            }

            const genreList = genres.split(',').map(g => g.trim()).filter(g => g);
            const normalizedAdURL = adURL ? normalizeVideoURL(adURL) : null;
            const oldEpisodes = anime.episodes;
            anime.name = name;
            anime.season = parseInt(season);
            anime.genres = genreList;
            anime.episodes = parseInt(episodes);
            anime.adURL = normalizedAdURL;

            const newEpisodeData = {};
            for (let i = 1; i <= anime.episodes; i++) {
                const normalizedVideoURL = normalizeVideoURL(episodeURLs[i]);
                newEpisodeData[i] = { name: `Episódio ${i}`, video: normalizedVideoURL };
            }
            anime.episodesData = newEpisodeData;
            anime.episodeCoverURL = extractVideoThumbnail(episodeURLs[1]) || anime.coverURL;

            if (anime.episodes < oldEpisodes) {
                for (let i = anime.episodes + 1; i <= oldEpisodes; i++) {
                    delete anime.episodesData[i];
                }
            }

            saveData();
            updateAdminAnimeList();
            updateAnimeGrid();
            updateHighlightsGrid();
            message.textContent = 'Anime atualizado!';
        }

        function deleteAnime(index) {
            if (currentUser !== 'ADM') return;
            if (confirm(`Confirma a exclusão de "${animes[index].name}"?`)) {
                animes.splice(index, 1);
                releases = releases.filter(r => r.animeIndex !== index).map(r => ({ ...r, animeIndex: r.animeIndex > index ? r.animeIndex - 1 : r.animeIndex }));
                saveData();
                updateAdminAnimeList();
                updateAnimeGrid();
                updateHighlightsGrid();
                document.getElementById('admin-message').textContent = 'Anime excluído!';
            }
        }

        document.addEventListener('click', (e) => {
            const userDropdown = document.getElementById('user-dropdown');
            const userAccount = document.getElementById('user-account');
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.getElementById('menu-toggle');

            if (!userDropdown.contains(e.target) && !userAccount.contains(e.target) && userDropdown.classList.contains('show')) {
                userDropdown.classList.remove('show');
            }

            if (!sidebar.contains(e.target) && !menuToggle.contains(e.target) && sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        });

        document.getElementById('menu-toggle').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSidebar();
        });

        document.getElementById('sidebar').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        document.getElementById('user-account').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleUserDropdown();
        });

        if (currentUser && users[currentUser]) {
            updateUserInterface();
            showSection(currentUser === 'ADM' ? 'admin' : 'anime');
        } else {
            localStorage.removeItem('currentUser');
            showSection('auth');
        }
